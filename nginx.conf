# nginx configuration for zhenya
# Place in /etc/nginx/sites-available/zhenya (or include from main config)
# Adjust paths and domain before use.

server {
    listen 80;
    server_name forumdance.ru www.forumdance.ru;

    root /var/www/zhenya;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/plain
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Brotli (if module installed)
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/html text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Content Security Policy (adjust if needed)
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        frame-src 'self' https://www.youtube.com https://yandex.com https://yandex.ru;
        connect-src 'self';
        form-action 'self';
        base-uri 'self';
    " always;

    # Cache static assets
    location ~* \.(jpg|jpeg|png|webp|svg|ico|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Clean URLs: serve /path/ -> /path/index.html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # 404 handler
    error_page 404 /404.html;

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
